<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Palette Preview — 34 Colors</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .section {
    min-height: 100vh;
    padding: 1.5rem 1.5rem 3rem;
    display: flex;
    flex-direction: column;
  }
  .section.dark  { background: #1e1e1e; color: #ccc; }
  .section.light { background: #f0f0f0; color: #333; }
  h1 { font-size: 1.3rem; margin-bottom: 0.2rem; }
  .dark  h1 { color: #eee; }
  .light h1 { color: #222; }
  p.subtitle { font-size: 0.8rem; margin-bottom: 1rem; }
  .dark  p.subtitle { color: #666; }
  .light p.subtitle { color: #999; }
  .palette {
    display: flex;
    flex-direction: row;
    flex: 1;
    gap: 3px;
    min-height: 0;
  }
  .bar {
    flex: 1;
    min-width: 0;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 10px;
    position: relative;
    cursor: default;
  }
  .bar:hover { outline: 2px solid rgba(255,255,255,0.6); outline-offset: -2px; }
  .bar .label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: 0.2px;
  }
  .bar .hex-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 9px;
    font-family: monospace;
    opacity: 0.5;
    position: absolute;
    top: 10px;
  }
</style>
</head>
<body>

<div class="section dark">
  <h1>Dark Mode — 34 Colors</h1>
  <p class="subtitle">24 algorithmically generated + 9 pure emoji colors. Sorted by perceptual hue (OKLab).</p>
  <div class="palette" id="dark-palette"></div>
</div>

<div class="section light">
  <h1>Light Mode — 34 Colors</h1>
  <p class="subtitle">24 algorithmically generated + 9 pure emoji colors. Sorted by perceptual hue (OKLab).</p>
  <div class="palette" id="light-palette"></div>
</div>

<script>
// Each entry: [dark_hex, light_hex, emoji (3 squares), name]
// 25 algorithm-generated colors + 9 pure emoji colors
const PALETTE = [
  // ── Reds & Pinks ──────────────────────────────────────────────
  ["#500707", "#f69292",  "🟥🟥🟥", "Red"],
  ["#60052e", "#f79eb9",  "🟥🟥🟪", "Crimson"],
  ["#4a0404", "#f4877b",  "🟥🟥⬛", "Blood"],
  ["#3f032a", "#f47bab",  "🟥🟪🟪", "Berry"],

  // ── Browns & Oranges ──────────────────────────────────────────
  ["#3f200d", "#ebbda2",  "🟫🟫🟫", "Brown"],
  ["#2b1717", "#d19f9f",  "🟫🟥🟥", "Maroon"],
  ["#502907", "#f6c192",  "🟧🟧🟧", "Orange"],
  ["#601305", "#e1c6c1",  "🟧🟧🟥", "Rust"],
  ["#6b2e06", "#f4ab7b",  "🟧🟧🟫", "Ember"],

  // ── Yellows & Olives ──────────────────────────────────────────
  ["#706a0a", "#f6f392",  "🟨🟨🟨", "Yellow"],
["#584d0d", "#f8e9aa",  "🟩🟨🟫", "Olive"],
  ["#6b6b06", "#b8e28d",  "🟨🟨🟩", "Chartreuse"],

  // ── Greens ────────────────────────────────────────────────────
  ["#075007", "#92f692",  "🟩🟩🟩", "Green"],
  ["#386b06", "#cdf8aa",  "🟩🟩🟨", "Lime"],
  ["#011501", "#88b888",  "🟩🟩⬛", "Forest"],
  ["#172b17", "#7bf47b",  "🟩⬜⬛", "Sage"],
  ["#064a0e", "#80e898",  "🟩🟩🟦", "Emerald"],

  // ── Teals ─────────────────────────────────────────────────────
  ["#102e24", "#60d8b0",  "🟦🟩🟩", "Juniper"],
  ["#066b6b", "#aae5f8",  "🟦🟦🟩", "Teal"],

  // ── Blues ─────────────────────────────────────────────────────
  ["#06516b", "#7bd6f4",  "🟦🟦🟫", "Petrol"],
  ["#010f20", "#7898b0",  "🟦🟦⬛", "Navy"],
  ["#070750", "#9292f6",  "🟦🟦🟦", "Blue"],
  ["#06296b", "#87b3f5",  "🟦⬛🟦", "Cobalt"],
  ["#06066b", "#8797f5",  "🟦🟦🟪", "Ultramarine"],
  ["#0d0d35", "#7b7bf4",  "⬛⬛🟦", "Midnight"],

  // ── Purples ───────────────────────────────────────────────────
  ["#1e1c49", "#b88de2",  "🟦🟪🟪", "Indigo"],
  ["#2b0750", "#c492f6",  "🟪🟪🟪", "Purple"],
  ["#4c066b", "#c0a7d5",  "🟪🟪🟦", "Violet"],
  ["#250638", "#d860d8",  "🟪🟪⬛", "Plum"],
  ["#492749", "#f2b0ef",  "🟪⬜⬛", "Mauve"],
  ["#6b066b", "#e28dd6",  "🟪🟪🟥", "Magenta"],

  // ── Achromatics ───────────────────────────────────────────────
  ["#080808", "#b8b8b8",  "⬛⬛⬛", "Black"],
  ["#1c1c1c", "#dadada",  "⬜⬛⬜", "Gray"],
  ["#323232", "#f0f0f0",  "⬜⬜⬜", "White"],
];

// Sort by OKLab hue (perceptually uniform), achromatics last
function hexToOklabHue(hex) {
  let r = parseInt(hex.slice(1,3),16)/255;
  let g = parseInt(hex.slice(3,5),16)/255;
  let b = parseInt(hex.slice(5,7),16)/255;
  const lin = x => x <= 0.04045 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
  r = lin(r); g = lin(g); b = lin(b);
  const l_ = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b);
  const m_ = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b);
  const s_ = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
  const a  =  1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_;
  const bv =  0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_;
  const chroma = Math.sqrt(a*a + bv*bv);
  if (chroma < 0.015) return 999; // achromatic → sort to end
  return (Math.atan2(bv, a) * 180 / Math.PI + 360) % 360;
}

const sorted = PALETTE.slice().sort((a, b) => {
  const ha = hexToOklabHue(a[0]);
  const hb = hexToOklabHue(b[0]);
  return ha - hb;
});

function luminance(hex) {
  const [r,g,b] = [hex.slice(1,3), hex.slice(3,5), hex.slice(5,7)].map(c => {
    const v = parseInt(c,16)/255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*r + 0.7152*g + 0.0722*b;
}

function textColor(bg) {
  return luminance(bg) > 0.12 ? '#000000bb' : '#ffffffbb';
}

function renderPalette(containerId, colorIndex) {
  const container = document.getElementById(containerId);
  sorted.forEach(([darkHex, lightHex, emoji, name]) => {
    const hex = colorIndex === 0 ? darkHex : lightHex;
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.background = hex;
    bar.style.color = textColor(hex);

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = `${emoji} ${name}`;
    bar.appendChild(label);

    const hexLabel = document.createElement('span');
    hexLabel.className = 'hex-label';
    hexLabel.textContent = hex;
    bar.appendChild(hexLabel);

    container.appendChild(bar);
  });
}

renderPalette('dark-palette',  0);
renderPalette('light-palette', 1);
</script>
</body>
</html>
